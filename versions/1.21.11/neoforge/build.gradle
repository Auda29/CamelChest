plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'maven-publish'
}

version = rootProject.version
group = rootProject.group

base {
    archivesName = rootProject.archives_base_name
}

sourceSets {
    main {
        java.srcDir rootProject.file('../../common/src/main/java')
        java.srcDir rootProject.file('../../neoforge/src/main/java')
        java.srcDir rootProject.file('common/src/main/java')
        java.exclude { element ->
            element.file.canonicalFile == rootProject.file('../../common/src/main/java/dev/wecke/camelchest/client/CamelChestLayer.java').canonicalFile
        }
        resources.srcDir rootProject.file('../../common/src/main/resources')
        resources.srcDir rootProject.file('../../neoforge/src/main/resources')
    }
    test {
        java.srcDir rootProject.file('../../common/src/test/java')
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        camelchest {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.camelchest
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'neoforge_version', rootProject.neoforge_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            version: project.version,
            minecraft_version: rootProject.minecraft_version,
            neoforge_version: rootProject.neoforge_version
        )
    }

    filesMatching('*.mixins.json') {
        expand(java_version: 21)
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}+mc${rootProject.minecraft_version}-neoforge"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
