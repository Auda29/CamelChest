plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
    id 'maven-publish'
}

version = rootProject.version
group = rootProject.group

def minecraftVersion = rootProject.minecraft_version.toString()
def targetJavaVersion = minecraftVersion.startsWith('26.') ? 25 : 21

base {
    archivesName = rootProject.archives_base_name
}

sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
    }
    test {
        java.srcDir rootProject.file('common/src/test/java')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

loom {
    mods {
        camelchest {
            sourceSet sourceSets.main
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraftVersion
    inputs.property 'fabric_loader_version', rootProject.fabric_loader_version
    inputs.property 'java_version', targetJavaVersion

    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            minecraft_version: minecraftVersion,
            fabric_loader_version: rootProject.fabric_loader_version,
            java_version: targetJavaVersion
        )
    }

    filesMatching('*.mixins.json') {
        expand(java_version: targetJavaVersion)
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}+mc${minecraftVersion}-fabric"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
