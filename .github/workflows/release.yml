name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail

          project_version="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties | tr -d '\r')"
          archive_name="$(awk -F= '$1 == "archives_base_name" { print $2 }' gradle.properties | tr -d '\r')"

          if [[ -z "${project_version}" || -z "${archive_name}" ]]; then
            echo "::error file=gradle.properties::mod_version and archives_base_name must be set."
            exit 1
          fi

          expected_tag="v${project_version}"
          should_release="true"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error file=gradle.properties::Tag ${GITHUB_REF_NAME} does not match mod_version ${project_version}. Expected ${expected_tag}."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::The released commit is not contained in the main branch."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "branch" ]] && git show-ref --verify --quiet "refs/tags/${expected_tag}"; then
            should_release="false"
            echo "Release tag ${expected_tag} already exists. No release is needed for this main branch push."
          fi

          {
            echo "version=${project_version}"
            echo "archive_name=${archive_name}"
            echo "tag=${expected_tag}"
            echo "should_release=${should_release}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Java 21
        if: steps.release_metadata.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Java 25
        if: steps.release_metadata.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.release_metadata.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test all supported targets
        if: steps.release_metadata.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build
          ./gradlew --no-daemon -p versions/1.21.11 clean build
          ./gradlew --no-daemon -p versions/1.21.1 clean build

      - name: Prepare release assets
        if: steps.release_metadata.outputs.should_release == 'true'
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.release_metadata.outputs.archive_name }}
          PROJECT_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          artifact_path() {
            local minecraft_version="$1"
            local loader="$2"
            local jar_name="${ARCHIVE_NAME}-${PROJECT_VERSION}+mc${minecraft_version}-${loader}.jar"

            if [[ "${minecraft_version}" == "26.2" ]]; then
              printf '%s\n' "${loader}/build/libs/${jar_name}"
            else
              printf '%s\n' "versions/${minecraft_version}/${loader}/build/libs/${jar_name}"
            fi
          }

          for minecraft_version in 26.2 1.21.11 1.21.1; do
            for loader in fabric neoforge; do
              jar_path="$(artifact_path "${minecraft_version}" "${loader}")"
              if [[ ! -s "${jar_path}" ]]; then
                echo "::error::Expected release artifact was not created: ${jar_path}"
                exit 1
              fi

              cp "${jar_path}" dist/
              jar_name="$(basename "${jar_path}")"
              checksum="$(sha256sum "dist/${jar_name}" | awk '{ print $1 }')"
              printf '%s  %s\n' "${checksum}" "${jar_name}" > "dist/${jar_name}.sha256"
            done
          done

          jar_count="$(find dist -maxdepth 1 -type f -name '*.jar' | wc -l | tr -d ' ')"
          checksum_count="$(find dist -maxdepth 1 -type f -name '*.jar.sha256' | wc -l | tr -d ' ')"
          if [[ "${jar_count}" != "6" || "${checksum_count}" != "6" ]]; then
            echo "::error::Expected six JARs and six checksum files, found ${jar_count} and ${checksum_count}."
            exit 1
          fi

      - name: Create the release tag
        if: github.ref == 'refs/heads/main' && steps.release_metadata.outputs.should_release == 'true'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
        run: |
          set -euo pipefail

          tag_object_sha="$(
            gh api --method POST "repos/${GH_REPO}/git/tags" \
              -f tag="${RELEASE_TAG}" \
              -f message="Release ${RELEASE_TAG}" \
              -f object="${GITHUB_SHA}" \
              -f type="commit" \
              --jq '.sha'
          )"

          gh api --method POST "repos/${GH_REPO}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${tag_object_sha}" >/dev/null

      - name: Create or update the GitHub release
        if: steps.release_metadata.outputs.should_release == 'true'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_VERSION: ${{ steps.release_metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
            exit 0
          fi

          release_args=(
            "${RELEASE_TAG}"
            dist/*
            --verify-tag
            --generate-notes
            --title "Camel Chest ${PROJECT_VERSION}"
          )

          if [[ "${PROJECT_VERSION}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
